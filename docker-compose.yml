version: "3.9"
services:
  embeddings:
    image: ghcr.io/huggingface/text-embeddings-inference:cpu-1.5
    container_name: lth-embeddings
    ports:
      - "8080:80"
    volumes:
      - ~/.lth/hf-cache:/data
    command: --model-id nomic-ai/nomic-embed-text-v1.5 --port 80
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 60s
